name: Update publications

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays 06:00 UTC
  workflow_dispatch:       # "Run workflow" button in the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Fetch citation counts
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python3 scripts/update_citations.py

      - name: Stop if nothing changed
        id: diff
        run: |
          if git diff --quiet cv/publications.yaml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: typst-community/setup-typst@v4
        if: steps.diff.outputs.changed == 'true'

      - name: Rebuild publications page and CV
        if: steps.diff.outputs.changed == 'true'
        run: |
          python3 scripts/build_publications.py
          typst compile --root . cv/cv.typ cv.pdf

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cv/publications.yaml publications.html cv.pdf
          git commit -m "chore: weekly citation update"
          git push
