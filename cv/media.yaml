# Talks, films and posters for presentations.html; the home page "Talks & media"
# section shows the first two `media` entries (it is hidden while that list is empty).
# Rebuild with
#   python3 scripts/build_publications.py
#
# media — newest first
#   title    shown under the video
#   youtube  video ID or any YouTube URL (click-to-load embed)
#   file     or a self-hosted .mp4 under media/ (keep it small: 1080p, ~15 MB),
#   link     or a page on another video site, opened in a new tab
#            (file and link take an optional poster image)
#   kind     optional, e.g. Talk, Interview, Demo
#   venue    optional, e.g. NeurIPS 2026
#   date     optional, e.g. Dec 2026
#   note     optional, e.g. In Danish
#
# posters — newest first; PDFs and 1200 px wide JPG previews live in media/posters/
#   title, authors (same "W Lehn-Schiøler" form as publications.yaml), event, date, year
#   pdf, image   the poster and its preview (shown cropped to the top, full size on click)
#   abstract     optional, shown in an "Abstract" panel
#   paper        optional link to the paper the poster presents
#
# Example:
#   - title: "Looking inside EEG foundation models with sparse autoencoders"
#     youtube: "https://www.youtube.com/watch?v=XXXXXXXXXXX"
#     kind: Talk
#     venue: NeurIPS 2026
#     date: Dec 2026

