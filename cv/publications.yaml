#   venue      short form for the CV
#   web_venue  longer form for publications.html (falls back to venue)
#   tag        optional badge on the web page (preprints are tagged automatically)
#   scholar_title  exact Google Scholar title, only when it differs from `title`
#   citations  Google Scholar count — rewritten weekly by scripts/update_citations.py
#              for peer-reviewed entries; do not hand-edit unless needed

